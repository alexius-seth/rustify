[package]
name = "rustify"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
rodio = { version = "0.20", features = ["symphonia-all"] }
lofty = "0.22"
walkdir = "2.5"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"